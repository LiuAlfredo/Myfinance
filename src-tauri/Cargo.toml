[package]
name = "myfinance"
version = "0.1.0"
description = "A modern local-first personal finance desktop application"
authors = ["MyFinance"]
edition = "2021"

[lib]
name = "myfinance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
