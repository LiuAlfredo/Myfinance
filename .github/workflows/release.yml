name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MyFinance ${{ github.ref_name }}
          releaseBody: "请在应用的设置页点击“检查更新”，或下载安装包手动升级。"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis
      - name: Normalize updater download URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseDir = Join-Path $env:RUNNER_TEMP "myfinance-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir $releaseDir
          $manifestPath = Join-Path $releaseDir "latest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer asset was found in release $tag"
          }

          $assetName = [Uri]::EscapeDataString($installer.name)
          $manifest.platforms.'windows-x86_64'.url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$assetName"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM $manifestPath
          gh release upload $tag $manifestPath --repo $env:GITHUB_REPOSITORY --clobber

          $published = Invoke-RestMethod "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/latest.json?run=$env:GITHUB_RUN_ID"
          if ($published.platforms.'windows-x86_64'.url -notlike "https://github.com/*/releases/download/$tag/*.exe") {
            throw "Published updater manifest does not contain a direct installer URL"
          }
